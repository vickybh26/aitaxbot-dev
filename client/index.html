    <!-- Client-Side Error Logger
         The red on-page banner is a DEBUGGING tool and must never render for
         real visitors. It previously fired on any unhandled rejection —
         including AdSense's "Failed to fetch", which happens on every pageview
         where an ad blocker, Brave shields or a corporate proxy blocks
         pagead2.googlesyndication.com. Visitors saw a full-width red error box
         covering the top of the site, for a third-party script failure that has
         no effect on the product working.

         Banner now appears only on localhost or with ?debug=1. Reporting to
         /api/logs/client is kept, minus third-party noise — that endpoint also
         carries the auth-failure telemetry, which is worth keeping legible. -->
    <script>
      (function() {
        var SHOW_BANNER =
          location.hostname === 'localhost' ||
          location.hostname === '127.0.0.1' ||
          /[?&]debug=1(&|$)/.test(location.search);

        // Failures originating in embedded ad/analytics scripts. We neither
        // surface nor report these: we cannot fix them and they are dominated
        // by ad-blocker traffic.
        var THIRD_PARTY = /googlesyndication|adsbygoogle|doubleclick|googletagmanager|google-analytics|adtrafficquality|clarity\.ms/i;

        function logError(type, payload) {
          console.error('[' + type + ']', payload);

          var isThirdParty = THIRD_PARTY.test(JSON.stringify(payload || {}));

          if (SHOW_BANNER) {
            var div = document.getElementById('debug-error-banner');
            if (!div) {
              div = document.createElement('div');
              div.id = 'debug-error-banner';
              div.style.position = 'fixed';
              div.style.top = '0';
              div.style.left = '0';
              div.style.width = '100%';
              div.style.background = '#fee2e2';
              div.style.color = '#991b1b';
              div.style.padding = '20px';
              div.style.borderBottom = '4px solid #f87171';
              div.style.zIndex = '99999999';
              div.style.fontFamily = 'monospace';
              div.style.fontSize = '14px';
              div.style.whiteSpace = 'pre-wrap';
              div.style.overflow = 'auto';
              div.style.maxHeight = '50vh';
              if (document.body) {
                document.body.appendChild(div);
              } else {
                document.documentElement.appendChild(div);
              }
            }
            div.textContent = '❌ CLIENT ERROR: ' + type + '\n\n' + JSON.stringify(payload, null, 2);
          }

          if (!isThirdParty) {
            fetch('/api/logs/client', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ type: type, payload: payload })
            }).catch(function() {});
          }
        }

        window.onerror = function(msg, url, line, col, err) {
          logError('onerror', { message: msg, url: url, line: line, col: col, stack: err ? err.stack : null });
          return false;
        };

        window.onunhandledrejection = function(event) {
          logError('onunhandledrejection', {
            reason: event.reason ? (event.reason.message || String(event.reason)) : null,
            stack: (event.reason && event.reason.stack) ? event.reason.stack : null
          });
        };
      })();
    </script>

    <!-- DPDP consent gate: default every category to DENIED before any tag
         library initializes. This must run before gtag/Clarity/AdSense are
         loaded — Google Consent Mode v2 only limits data collection if the
         default is set ahead of 'config'. CookieConsent.tsx calls
         gtag('consent','update',...) and window.__setClarityConsent(...)
         once the user actually makes a choice; until then, nothing here
         should collect or transmit personal data. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'wait_for_update': 500
      });

      // Clarity queues calls made before its script loads, so this is safe
      // to call immediately — it starts Clarity in consent-required mode,
      // meaning it won't send data until window.clarity('consent') is
      // called (done in CookieConsent.tsx once the user opts in).
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "rdz8mw3fw4");
      window.clarity("consent", false);

      // adsbygoogle.js itself has no consent-gate API — whether it fires
      // (and requests personalized vs. non-personalized ads) is controlled
      // entirely by CookieConsent.tsx, which only pushes ad requests after
      // the user opts in. Not loaded here; see CookieConsent.tsx.
    </script>

    <!-- Google tag (gtag.js) — loaded after the consent default above, so
         it starts in denied mode until the user consents. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9NMYMNBYFV"></script>

    </script>
